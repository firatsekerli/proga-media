    <div class="slogan serif">Gayrimenkulde<br><em>Fark Yaratan</em><br><em>Deneyim.</em></div>

    <div class="foot"><span>İlan No {{listing_no}}</span><span>Taşınmaz Ticareti Yetki Belgesi No 0601728</span></div>
  </div>
