<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="assets/base.css">
<style>
#post { width: 1080px; height: 1350px; display: flex; flex-direction: column; overflow: hidden; }
.top { width: 1080px; height: 640px; flex-shrink: 0; }
.top img.photo { width: 1080px; height: 640px; }
.body { flex: 1; box-sizing: border-box; padding: 56px 72px; display: flex; flex-direction: column; }
.eyebrow { font-size: 21px; color: #ACADBC; }
h2 { margin: 18px 0 0; font-size: 58px; line-height: 1.1; }
.rows { margin-top: 36px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 56px; }
.rows div { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid #262869; font-size: 23px; }
.rows span { color: #ACADBC; }
p { margin: auto 0 0; font-size: 20px; line-height: 1.5; color: #D6D6E0; }
</style></head>
<body>
<div id="post" class="navy">
  <div class="top"><img class="photo" src="{{photo}}" alt=""></div>
  <div class="body">
    <div class="eyebrow">İLAN BİLGİLERİ</div>
    <h2 class="serif">Taşınmazı <em>birlikte</em> değerlendirelim</h2>
    <div class="rows">{{rows}}</div>
    <p>Yalnızca ilan bilgilerine dayanarak karar verilmemesini öneriyoruz. Taşınmazın yerinde gösterimi randevu ile yapılır.</p>
  </div>
</div>
</body></html>
