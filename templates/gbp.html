<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="assets/base.css">
<style>
#post { width: 1600px; height: 760px; display: flex; overflow: hidden; }
.panel { width: 760px; flex-shrink: 0; box-sizing: border-box; padding: 64px 72px; display: flex; flex-direction: column; }
.panel .logo { width: 170px; display: block; }
.panel .eyebrow { margin-top: auto; font-size: 18px; color: #ACADBC; }
.panel h1 { margin: 20px 0 0; font-size: 64px; line-height: 1.1; }
.panel p { margin: 28px 0 0; font-size: 22px; line-height: 1.5; color: #D6D6E0; max-width: 580px; }
.panel .foot { margin-top: auto; padding-top: 24px; border-top: 1px solid #262869; display: flex; justify-content: space-between; font-size: 18px; color: #ACADBC; }
.pic { flex: 1; height: 760px; }
.pic img { width: 100%; height: 760px; object-fit: cover; display: block; }
</style></head>
<body>
<div id="post">
  <div class="panel navy">
    <img class="logo" src="assets/logo-white.webp" alt="">
    <div class="eyebrow">{{eyebrow}}</div>
    <h1 class="serif">{{headline}}</h1>
    <p>{{line}}</p>
    <div class="foot"><span>proga.tr</span><span>0 (506) 875 49 69</span></div>
  </div>
  <div class="pic"><img src="{{photo}}" alt=""></div>
</div>
</body></html>
